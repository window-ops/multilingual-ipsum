<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Multilingual Ipsum</title>
    <link href="./default.css" rel="stylesheet">
    <link href="./style.css" rel="stylesheet">
  </head>
  <body>
    <div class="container p-3 position-relative">
      <div class="row">
        <!-- Settings Panel -->
        <div class="col-md-3 bg-light border rounded p-3">
          <button class="btn btn-primary w-100 mb-4" onclick="Generator.generate()">Generate Text</button>
          <div class="mb-3">
            <label class="form-label">Paragraphs</label>
            <input type="number" id="paragraphs" class="form-control" min="1" max="20" value="3">
          </div>
          <div class="mb-3">
            <label class="form-label">Min words/paragraph</label>
            <input type="number" id="minWords" class="form-control" min="10" max="100" value="25">
          </div>
          <div class="mb-3">
            <label class="form-label">Max words/paragraph</label>
            <input type="number" id="maxWords" class="form-control" min="10" max="100" value="45">
          </div>
          <div id="languageSwitches"></div>
        </div>
        <!-- Output Area -->
        <div class="col-md-9 ps-md-5">
          <div class="border rounded p-3 min-h-[300px]" id="output"></div>
        </div>
      </div>
    </div>
    <script src="./bootstrap.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
